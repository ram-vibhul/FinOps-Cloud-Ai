# Production-style stack: migrate (one-shot) + web + worker + PostgreSQL 17.
# Used for self-hosted installs and as the SaaS reference. Copy .env.example to .env first.
#
# Two database roles:
#   costlens      owner; used only by the one-shot `migrate` service
#   costlens_app  runtime role for web + worker; no superuser/BYPASSRLS, so
#                 PostgreSQL row-level security isolates organisations
name: costlens

x-app: &app
  image: ${COSTLENS_IMAGE:-ghcr.io/yugiverse/costlens:latest}
  build: .
  restart: unless-stopped
  env_file: .env
  environment: &app-env
    COSTLENS_DATABASE_URL: postgresql://costlens_app:${COSTLENS_DB_APP_PASSWORD:?set COSTLENS_DB_APP_PASSWORD in .env}@db:5432/costlens
    COSTLENS_SKIP_MIGRATE: "1"
  depends_on: &app-deps
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    environment:
      <<: *app-env
      COSTLENS_MIGRATION_DATABASE_URL: postgresql://costlens:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/costlens
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true

  web:
    <<: *app
    command: ["web"]
    ports:
      - "${COSTLENS_HTTP_PORT:-8000}:8000"

  worker:
    <<: *app
    command: ["worker"]
    # The image's HTTP healthcheck is for the web process; the worker has no HTTP port.
    # A worker heartbeat check is tracked in TRACKER.md (0.4).
    healthcheck:
      disable: true

  db:
    image: postgres:17.11-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: costlens
      POSTGRES_DB: costlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      COSTLENS_DB_APP_PASSWORD: ${COSTLENS_DB_APP_PASSWORD:?set COSTLENS_DB_APP_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/compose/postgres-init.sh:/docker-entrypoint-initdb.d/10-costlens-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U costlens -d costlens"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
