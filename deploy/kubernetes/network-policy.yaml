# Only the web pods accept traffic, and only on their HTTP port. Outgoing traffic stays
# open: CloudCostRadar calls cloud APIs, Slack/Teams, SSO providers and your database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ccradar-default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ccradar-web-http
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: web
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - { port: 8000, protocol: TCP }
