# CostLens platform on Kubernetes (self-hosted), D.5.
#   1. Copy costlens.env.example to costlens.env and fill it in (never commit it).
#   2. Set the image tag below and the host in ingress.yaml.
#   3. kubectl apply -k deploy/kubernetes
# PostgreSQL 17 runs outside these manifests (a managed database or your own operator),
# with two roles as in compose.yaml: an owner for migrations and a runtime role without
# superuser/BYPASSRLS so row-level security separates organisations.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: costlens
labels:
  - pairs:
      app.kubernetes.io/part-of: costlens
    includeSelectors: false
resources:
  - namespace.yaml
  - data-volume.yaml
  - migrate-job.yaml
  - web.yaml
  - worker.yaml
  - network-policy.yaml
  - ingress.yaml
images:
  - name: ghcr.io/yugiverse/costlens
    newTag: "0.1.0"
secretGenerator:
  - name: costlens-env
    envs:
      - costlens.env
generatorOptions:
  disableNameSuffixHash: false
