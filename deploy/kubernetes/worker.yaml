# Background jobs (imports, detectors, alerts). One replica is enough to start; more
# replicas share the queue safely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: costlens-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: costlens
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: costlens
        app.kubernetes.io/component: worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/yugiverse/costlens
          args: ["worker"]
          envFrom:
            - secretRef:
                name: costlens-env
          env:
            - { name: COSTLENS_DATA_DIR, value: /data }
          # The heartbeat job records the time every 5 minutes; restart after 15 without.
          livenessProbe:
            exec: { command: ["costlens", "worker-health"] }
            initialDelaySeconds: 600
            periodSeconds: 60
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 2Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: costlens-data }
        - { name: tmp, emptyDir: {} }
