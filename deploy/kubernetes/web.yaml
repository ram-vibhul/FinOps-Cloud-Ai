apiVersion: apps/v1
kind: Deployment
metadata:
  name: costlens-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: costlens
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: costlens
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/yugiverse/costlens
          args: ["web"]
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - secretRef:
                name: costlens-env
          env:
            - { name: COSTLENS_SKIP_MIGRATE, value: "1" }  # the migrate Job does it
            - { name: COSTLENS_DATA_DIR, value: /data }
            # Trust X-Forwarded-* from the ingress controller (set to its pod range).
            - { name: COSTLENS_FORWARDED_ALLOW_IPS, value: "*" }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: costlens-data }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: costlens-web
spec:
  selector:
    app.kubernetes.io/name: costlens
    app.kubernetes.io/component: web
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: costlens-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: costlens
      app.kubernetes.io/component: web
