# Example ingress: change the host, ingress class and TLS secret for your cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ccradar
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["ccradar.example.com"]
      secretName: ccradar-tls
  rules:
    - host: ccradar.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ccradar-web
                port: { name: http }
