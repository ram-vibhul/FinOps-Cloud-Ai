# Example ingress: change the host, ingress class and TLS secret for your cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: costlens
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["costlens.example.com"]
      secretName: costlens-tls
  rules:
    - host: costlens.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: costlens-web
                port: { name: http }
