{{- if not .Values.ccradar.existingSecret }}
{{- if not .Values.ccradar.token }}{{ fail "Set ccradar.token (or ccradar.existingSecret)." }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudcostradar-agent.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cloudcostradar-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.ccradar.token | quote }}
{{- end }}
