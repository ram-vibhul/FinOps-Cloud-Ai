{{- if not .Values.costlens.existingSecret }}
{{- if not .Values.costlens.token }}{{ fail "Set costlens.token (or costlens.existingSecret)." }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "costlens-agent.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "costlens-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.costlens.token | quote }}
{{- end }}
