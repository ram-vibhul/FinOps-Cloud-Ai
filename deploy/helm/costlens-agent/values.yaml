costlens:
  # Address of your CostLens (SaaS or self-hosted).
  url: ""
  clusterName: ""
  # Cluster token from CostLens -> Settings -> Kubernetes. Or use existingSecret.
  token: ""
  # Name of an existing Secret with key "token" (takes precedence over token).
  existingSecret: ""
  # Only for testing against a plain-http CostLens.
  allowHttp: false

image:
  repository: ghcr.io/costlens/costlens-agent
  tag: ""  # defaults to the chart appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
