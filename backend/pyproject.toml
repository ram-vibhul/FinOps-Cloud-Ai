[project]
name = "ccradar"
version = "0.1.0"
description = "CloudCostRadar - cloud cost management and Kubernetes operations platform by Yugiverse"
license = "LicenseRef-Proprietary"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "sqlalchemy==2.1.8",
  "alembic==1.20.1",
  "procrastinate==3.10.0",
  "httpx==0.28.1",
  "boto3==1.43.126",
  "anthropic==2.5.0",
  "pyjwt==2.15.1",
  "cryptography==50.0.2",
  "psycopg[binary]==3.3.8",
  "pyarrow==26.0.1",
  "reportlab==5.1.0",
  "pyyaml==6.0.3",
  "sentry-sdk==2.74.0",  # MIT; error tracking, off unless CCRADAR_ERROR_TRACKING_DSN (D.9)
]

[project.optional-dependencies]
dev = [
  # Only the in-cluster agent (its own image) uses the Kubernetes client; the backend
  # tests exercise the agent's code, so it is needed here but not in the platform image.
  "kubernetes==37.0.1",
  "pytest==9.2.0",
  "ruff==0.17.3",
  "pyright==1.1.414",
]

[project.scripts]
ccradar = "ccradar.cli:main"

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ccradar = ["py.typed", "migrations/script.py.mako", "billing/plans.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../agent/src"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:ccradar.*"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLC0415"]  # lazy imports keep CLI and startup fast

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PLR0911"]
# Fake vendor answers mirror the real JSON and read better on one line.
"tests/test_connectors.py" = ["E501"]
"tests/test_ai_insights.py" = ["E501"]
"tests/test_bedrock_logs.py" = ["E501"]
"tests/test_scim.py" = ["E501"]
"tests/test_elevation.py" = ["E501"]
"tests/test_partners.py" = ["E501"]
"tests/test_fixes.py" = ["E501"]
"tests/test_mcp.py" = ["E501"]
"tests/test_custom_roles.py" = ["E501"]
"tests/test_domain_policy.py" = ["E501"]
"tests/test_partner_signup.py" = ["E501"]
"tests/test_setup.py" = ["E501"]
"migrations/**" = ["E501"]
# Detector modules are mostly customer-facing prose (titles, steps, commands).
"src/ccradar/findings/**" = ["E501"]
"src/ccradar/aws_audit/**" = ["E501"]
"src/ccradar/reports/**" = ["E501"]
# Vendor API connectors: SQL text and request shapes read better unwrapped.
"src/ccradar/connectors/**" = ["E501"]
"src/ccradar/clouds/setup_help.py" = ["E501"]
"src/ccradar/accounts/domains.py" = ["E501"]
"src/ccradar/api/scim.py" = ["E501"]  # SCIM schema literals
"src/ccradar/accounts/elevation.py" = ["E501"]
"src/ccradar/api/elevation.py" = ["E501"]
"src/ccradar/api/partners.py" = ["E501"]
"src/ccradar/accounts/partners.py" = ["E501"]
"src/ccradar/clouds/aws/fixes.py" = ["E501"]
"src/ccradar/api/fixes.py" = ["E501"]
"src/ccradar/jobs/findings.py" = ["E501"]
"src/ccradar/api/mcp.py" = ["E501"]
"src/ccradar/api/custom_roles.py" = ["E501"]
"src/ccradar/accounts/custom_roles.py" = ["E501"]
"src/ccradar/accounts/domain_policy.py" = ["E501"]
"src/ccradar/api/teams.py" = ["E501"]
"src/ccradar/core/images.py" = ["E501"]  # allow-lists
"src/ccradar/api/setup.py" = ["E501"]  # copyable commands and role descriptions

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["../agent/src", "../sdk/python/src"]  # end-to-end tests drive the real agent and SDK
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
