[project]
name = "costlens"
version = "0.1.0"
description = "CostLens - cloud cost management and Kubernetes operations platform by Yugiverse"
license = "LicenseRef-Proprietary"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "sqlalchemy==2.1.8",
  "alembic==1.20.1",
  "procrastinate==3.10.0",
  "httpx==0.28.1",
  "boto3==1.43.124",
  "kubernetes==37.0.1",
  "anthropic==2.5.0",
  "pyjwt==2.15.1",
  "cryptography==50.0.2",
  "psycopg[binary]==3.3.8",
  "pyarrow==26.0.1",
  "reportlab==5.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.3",
  "pyright==1.1.414",
]

[project.scripts]
costlens = "costlens.cli:main"

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
costlens = ["py.typed", "migrations/script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../agent/src"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:costlens.*"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLC0415"]  # lazy imports keep CLI and startup fast

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PLR0911"]
"migrations/**" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["../agent/src"]  # end-to-end test drives the real agent code
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
