# Developer convenience: `alembic revision --autogenerate -m "..."` from backend/.
# The URL comes from CCRADAR_DATABASE_URL via ccradar.cli.alembic_config at runtime;
# this file is only used by the alembic command-line tool.
[alembic]
script_location = src/ccradar/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
sqlalchemy.url = sqlite:///./data/ccradar.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
