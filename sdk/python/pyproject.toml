[project]
name = "ccradar-ai"
version = "0.1.0"
description = "Report AI/LLM token usage to CloudCostRadar: counts and salted fingerprints only, never prompt text."
requires-python = ">=3.10"
license = { text = "Proprietary (see the CloudCostRadar LICENSE); open-source licence pending, tracker Q13" }
dependencies = []

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
venvPath = "../../backend"
venv = ".venv"
