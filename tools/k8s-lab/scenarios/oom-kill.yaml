# expected top-ranked cause: oom
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels: {ccradar-lab: "oom-kill"}
spec:
  replicas: 1
  selector: {matchLabels: {app: lab}}
  template:
    metadata: {labels: {app: lab}}
    spec:
      containers:
        - name: app
          image: polinux/stress:1.0.4
          command: ["stress", "--vm", "1", "--vm-bytes", "300M", "--vm-hang", "1"]
          resources: {requests: {memory: 64Mi}, limits: {memory: 128Mi}}
