# expected top-ranked cause: unschedulable
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels: {costlens-lab: "unschedulable"}
spec:
  replicas: 1
  selector: {matchLabels: {app: lab}}
  template:
    metadata: {labels: {app: lab}}
    spec:
      containers:
        - name: app
          image: busybox:1.37
          command: ["sleep", "3600"]
          resources: {requests: {memory: 512Gi}}
